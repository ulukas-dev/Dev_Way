<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/CadastroCliente.css">
    <title>Criar Conta - LojaDaBanda</title>
</head>
<body>

    <nav class="cabecalho">
        <div class="logo">LojaDaBanda</div>
        <div class="linksNav">
            <a href="HomePageCliente.html"> Voltar</a>
        </div>
    </nav>

    <div class="caixaPrincipal">
        <div class="cartao">
            <h1>Criar Conta</h1>
            <p>Preencha os dados para começar a comprar</p>

            <form>
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Seu nome">
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input type="email" placeholder="seuEmail@gmail.com">
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="********">
                </div>

                <button type="submit" class="botao">Criar Conta</button>
            </form>

            <div class="texto-link">
                Já tem uma conta? <a href="Entrar.html">Entrar</a>
            </div>
        </div>
    </div>

    <footer class="rodape">
        <p>© 2026 LojaDaBanda - Todos os direitos reservados</p>
    </footer>
</body>
</html>
