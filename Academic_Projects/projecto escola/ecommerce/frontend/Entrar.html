<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/Entrar.css">
    <title>Entrar - LojaDaBanda</title>
</head>
<body>

    <nav class="cabecalho">
        <div class="logo">LojaDaBanda</div>
        <div class="linksNav">
            <a href="#"> Voltar</a>
        </div>
    </nav>

    <div class="caixaPrincipal">
        <div class="card">
            <h1>Entrar</h1>
            <p>Acesse sua conta para continuar comprando</p>

            <form>
                <div class="campo">
                    <label>Email</label>
                    <input type="email" placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="***********">
                </div>

                <button type="submit" class="botao">Entrar</button>
            </form>

            <div class="textoLink">
                Ainda não tem conta? <a href="CadastroCliente.html">Criar Conta</a>
            </div>
        </div>
    </div>

    <footer class="rodape">
        <p>© 2026 LojaDaBanda - Todos os direitos reservados</p>
    </footer>

</body>
</html>
